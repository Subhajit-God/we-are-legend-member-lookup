<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>WE ARE LEGEND — Wall of Fame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .page{max-width:720px;}
  .nav-links{display:flex; justify-content:center; gap:16px; margin-bottom:8px; font-size:12px;}
  .nav-links a{color:var(--gold-light); text-decoration:none;}
  .nav-links a:hover{text-decoration:underline;}
  .fame-tabs{display:flex; gap:8px; margin-bottom:16px;}
  .fame-tab{
    flex:1; background:var(--navy-2); border:1px solid var(--line); color:var(--paper-dim);
    padding:9px; border-radius:20px; font-size:12.5px; cursor:pointer; text-align:center;
  }
  .fame-tab.active{border-color:var(--gold); color:var(--gold-light); background:rgba(201,162,39,.08);}
  .fame-row{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line-soft);}
  .fame-icon{font-size:22px; flex-shrink:0;}
  .fame-title{font-weight:600; color:var(--white); font-size:13.5px;}
  .fame-sub{font-size:11.5px; color:var(--paper-dim); margin-top:2px;}
</style>
</head>
<body>

<div class="page">
  <header class="crest">
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark theme">🌙</button>
    <div class="crest-mark">⚜</div>
    <div class="crest-title">WE ARE LEGEND</div>
    <div class="crest-sub">Wall of Fame</div>
  </header>

  <div class="nav-links">
    <a href="index.html">🔎 Look Up a Member</a>
    <a href="directory.html">📇 Member Directory</a>
  </div>

  <main class="lookup-card">
    <div class="lookup-intro">Every award and achievement earned across WE ARE LEGEND.</div>
    <div class="fame-tabs">
      <button class="fame-tab active" data-tab="awards">🏆 Awards</button>
      <button class="fame-tab" data-tab="achievements">🏅 Achievements</button>
    </div>
    <div id="statusLine" class="status-line"></div>
    <div id="fameList"></div>
  </main>

  <footer class="page-footer">
    <div class="motto">&ldquo;Together in Happiness, Together in Difficulties, Legends Forever.&rdquo;</div>
  </footer>
</div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="wall-of-fame.js"></script>
</body>
</html>
