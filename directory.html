<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>WE ARE LEGEND — Member Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .page{max-width:820px;}
  .dir-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:14px; margin-top:20px;}
  .dir-card{
    background:var(--navy); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:16px; text-align:center; text-decoration:none; color:inherit; display:block;
    transition:border-color .15s, transform .1s;
  }
  .dir-card:hover{border-color:var(--gold-dim); transform:translateY(-2px);}
  .dir-photo{
    width:64px; height:64px; border-radius:50%; border:1.5px solid var(--gold); margin:0 auto 10px;
    display:flex; align-items:center; justify-content:center; font-family:var(--font-display);
    font-size:22px; color:var(--gold-light); background:var(--navy-2); overflow:hidden;
  }
  .dir-photo img{width:100%; height:100%; object-fit:cover;}
  .dir-name{font-size:14px; font-weight:600; color:var(--white);}
  .dir-role{font-size:11px; color:var(--paper-dim); margin-top:3px;}
  .nav-links{display:flex; justify-content:center; gap:16px; margin-bottom:8px; font-size:12px;}
  .nav-links a{color:var(--gold-light); text-decoration:none;}
  .nav-links a:hover{text-decoration:underline;}
</style>
</head>
<body>

<div class="page">
  <header class="crest">
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark theme">🌙</button>
    <div class="crest-mark">⚜</div>
    <div class="crest-title">WE ARE LEGEND</div>
    <div class="crest-sub">Public Member Directory</div>
  </header>

  <div class="nav-links">
    <a href="index.html">🔎 Look Up a Member</a>
    <a href="wall-of-fame.html">🏆 Wall of Fame</a>
  </div>

  <main class="lookup-card">
    <div class="lookup-intro">Members who've chosen to be listed publicly. Tap anyone to view their full record.</div>
    <div class="lookup-form" style="margin-bottom:0;">
      <input type="text" id="dirSearch" placeholder="Search by name or role…">
    </div>
    <div id="statusLine" class="status-line"></div>
    <div id="dirGrid" class="dir-grid"></div>
  </main>

  <footer class="page-footer">
    <div class="motto">&ldquo;Together in Happiness, Together in Difficulties, Legends Forever.&rdquo;</div>
    <div class="sub-footer">Only members who opted in from their Member Profile appear here.</div>
  </footer>
</div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="directory.js"></script>
</body>
</html>
